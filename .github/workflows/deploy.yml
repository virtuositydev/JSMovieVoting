name: Build and Deploy to VKS

on:
  push:
    branches:
      - ewb-demo

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API
        run: |
          docker build -t vsgdev/movie-voting-api:2026v1 ./server -f ./server/Dockerfile-dev
          docker push vsgdev/movie-voting-api:2026v1

      - name: Build and Push Client
        run: |
          docker build -t vsgdev/movie-voting-client:2026v1 ./client -f ./client/Dockerfile-dev
          docker push vsgdev/movie-voting-client:2026v1

      - name: VKS Cluster Login
        env:
          KUBECTL_VSPHERE_PASSWORD: ${{ secrets.KUBECTL_VSPHERE_PASSWORD }}
        run: |
          /home/ubuntu/Desktop/vks-workspace/login/login-cluster

      - name: Deploy to Kubernetes
        run: |
          # Apply the latest manifests
          kubectl apply -f k8s.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods